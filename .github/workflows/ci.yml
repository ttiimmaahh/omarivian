name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.x"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  model-tests:
    name: JavaScript model
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Run model tests
        run: node tests/model.test.js

  omarchy-validation:
    name: Omarchy and QML
    runs-on: ubuntu-latest
    container: archlinux@sha256:c9dc8b5d1b06d8d50ace6d42b2c93fbb1e34c9e1332d1a2102936e497d3187ae

    steps:
      - name: Install validation tools
        run: pacman -Syu --noconfirm --needed git jq qt6-declarative quickshell

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Fetch validated Omarchy Quattro source
        env:
          OMARCHY_SHA: 0ae1694830b6bd9511042fe1b89a0062d8c083cb
        run: |
          git init /tmp/omarchy
          git -C /tmp/omarchy remote add origin https://github.com/basecamp/omarchy.git
          git -C /tmp/omarchy fetch --depth 1 origin "$OMARCHY_SHA"
          git -C /tmp/omarchy checkout --detach FETCH_HEAD

      - name: Validate plugin manifest
        run: bash /tmp/omarchy/bin/omarchy-plugin-validate .

      - name: Lint QML
        run: /usr/lib/qt6/bin/qmllint -I /tmp/omarchy/shell BarWidget.qml Panel.qml
